<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>License Key Generator</title>
<style>
  :root{
    --bg-0:#060912;
    --bg-1:#0b1220;
    --panel:#0f1830;
    --panel-2:#121d3a;
    --line:rgba(148,197,255,0.14);
    --cyan:#38bdf8;
    --cyan-2:#7dd3fc;
    --violet:#818cf8;
    --mint:#34d399;
    --ink:#e6edf7;
    --ink-dim:#8fa2c2;
  }

  *{ box-sizing:border-box; }

  html,body{ height:100%; margin:0; }

  body{
    background: radial-gradient(1200px 700px at 20% 15%, #0c1730 0%, var(--bg-0) 55%),
                var(--bg-0);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  /* Drifting circuit-dot grid */
  .grid-field{
    position:fixed; inset:-10%;
    background-image: radial-gradient(rgba(125,211,252,0.16) 1px, transparent 1px);
    background-size: 34px 34px;
    animation: driftGrid 40s linear infinite;
    mask-image: radial-gradient(700px 500px at 50% 45%, black 10%, transparent 75%);
    pointer-events:none;
  }
  @keyframes driftGrid{
    0%{ transform: translate(0,0); }
    100%{ transform: translate(-34px,-34px); }
  }

  /* Soft ambient glow orbs */
  .orb{
    position:fixed; border-radius:50%; filter: blur(70px); opacity:.35; pointer-events:none;
    animation: floatOrb 12s ease-in-out infinite;
  }
  .orb-a{ width:380px; height:380px; background:var(--cyan); top:-120px; left:-100px; }
  .orb-b{ width:340px; height:340px; background:var(--violet); bottom:-140px; right:-90px; animation-delay:-6s; }
  @keyframes floatOrb{
    0%,100%{ transform: translateY(0) scale(1); }
    50%{ transform: translateY(-24px) scale(1.06); }
  }

  .card{
    position:relative;
    width:400px;
    padding:38px 34px 30px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0)) , var(--panel);
    border-radius: 18px;
    border: 1px solid var(--line);
    box-shadow: 0 30px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset;
    text-align:center;
    animation: cardIn .7s cubic-bezier(.16,1,.3,1);
    overflow:hidden;
  }
  @keyframes cardIn{
    from{ opacity:0; transform: translateY(18px) scale(.97); }
    to{ opacity:1; transform:none; }
  }

  /* corner brackets, keycard style */
  .card::before, .card::after,
  .bracket-l, .bracket-r{
    content:""; position:absolute; width:16px; height:16px; border: 2px solid var(--cyan); opacity:.7;
  }
  .card::before{ top:10px; left:10px; border-right:none; border-bottom:none; border-top-left-radius:6px; }
  .card::after{ top:10px; right:10px; border-left:none; border-bottom:none; border-top-right-radius:6px; }
  .bracket-l{ bottom:10px; left:10px; border-right:none; border-top:none; border-bottom-left-radius:6px; }
  .bracket-r{ bottom:10px; right:10px; border-left:none; border-top:none; border-bottom-right-radius:6px; }

  /* scanning sweep line, plays on generate */
  .scan{
    position:absolute; left:0; right:0; top:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--cyan-2), transparent);
    box-shadow: 0 0 12px 2px rgba(56,189,248,.7);
    transform: translateY(-10px);
    opacity:0;
  }
  .scan.run{ animation: sweep 1.05s ease-in-out; }
  @keyframes sweep{
    0%{ opacity:0; transform: translateY(-6px); }
    10%{ opacity:1; }
    90%{ opacity:1; }
    100%{ opacity:0; transform: translateY(400px); }
  }

  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; letter-spacing:.14em; font-weight:700;
    color: var(--mint); text-transform:uppercase;
    background: rgba(52,211,153,0.08);
    border:1px solid rgba(52,211,153,0.25);
    padding:5px 10px; border-radius:100px;
    margin-bottom:16px;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%; background:var(--mint);
    box-shadow:0 0 8px var(--mint);
    animation: pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(.7); }
  }

  h2{
    margin:0 0 6px;
    font-size:22px; letter-spacing:-.01em;
    background: linear-gradient(120deg, var(--cyan-2), var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.sub{ color:var(--ink-dim); font-size:13px; margin:0 0 22px; line-height:1.5; }

  /* --- NEW MACHINE ID INPUT STYLES --- */
  .input-label {
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-dim);
    margin-bottom: 6px;
    margin-left: 2px;
  }
  #machineIdField {
    width: 100%;
    padding: 12px 14px;
    background: rgba(11, 18, 32, 0.6);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 10px;
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, monospace;
    font-size: 14px;
    outline: none;
    text-align: center;
    transition: border-color .25s, box-shadow .25s;
    margin-bottom: 18px;
  }
  #machineIdField:focus {
    border-color: var(--violet);
    box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
  }
  #machineIdField::placeholder{ color:#3c4a68; }

  .key-wrap{ position:relative; margin-bottom:18px; }

  #keyField{
    width:100%;
    padding:16px 14px;
    background: var(--bg-1);
    border: 1px solid var(--line);
    color: var(--cyan-2);
    border-radius:10px;
    text-align:center;
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, "Courier New", monospace;
    font-size:19px; font-weight:700; letter-spacing:3px;
    outline:none;
    transition: border-color .25s, box-shadow .25s;
  }
  #keyField::placeholder{ color:#3c4a68; letter-spacing:2px; }
  #keyField.active{
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.12), 0 0 22px rgba(56,189,248,0.25);
  }

  .btn{
    width:100%; padding:13px; border:none; border-radius:10px;
    font-weight:700; font-size:13.5px; letter-spacing:.01em; cursor:pointer;
    margin-bottom:10px;
    position:relative; overflow:hidden;
    transition: transform .15s ease, box-shadow .25s ease, filter .2s ease;
  }
  .btn:active{ transform: scale(.98); }

  .btn-gen{
    background: linear-gradient(135deg, var(--cyan) 0%, var(--violet) 100%);
    color:#04101f;
    box-shadow: 0 10px 24px rgba(56,189,248,0.25);
  }
  .btn-gen:hover{ filter:brightness(1.08); box-shadow: 0 12px 30px rgba(56,189,248,0.4); }

  .btn-copy{
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .btn-copy:hover{ background:#182749; border-color: rgba(148,197,255,0.3); }
  .btn-copy.done{ color: var(--mint); border-color: rgba(52,211,153,.4); }

  /* ripple */
  .ripple{
    position:absolute; border-radius:50%; background: rgba(255,255,255,.5);
    transform: scale(0); animation: rip .55s ease-out forwards; pointer-events:none;
  }
  @keyframes rip{ to{ transform:scale(3); opacity:0; } }

  .msg{
    min-height:16px; font-size:12px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    opacity:0; transform: translateY(4px);
    transition: opacity .3s, transform .3s;
  }
  .msg.show{ opacity:1; transform:none; }

  .check{
    width:14px; height:14px; flex-shrink:0;
  }
  .check path{
    stroke-dasharray: 20; stroke-dashoffset:20;
    animation: draw .35s ease forwards .1s;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
</style>
</head>
<body>
  <div class="grid-field"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <div class="card" id="card">
    <div class="scan" id="scan"></div>
    <span class="bracket-l"></span><span class="bracket-r"></span>

    <div class="eyebrow"><span class="dot"></span>Hardware Binding</div>

    <h2>Key Generator</h2>
    <p class="sub">Generate secure activation keys for clients.</p>

    <!-- NEW MACHINE ID SECTION -->
    <div class="input-label">Client Machine ID:</div>
    <input type="text" id="machineIdField" placeholder="e.g. MACHINE-F4-46-37...">

    <div class="key-wrap">
      <input type="text" id="keyField" readonly placeholder="XXXX · XXXX · XXXX · XX">
    </div>

    <button class="btn btn-gen" id="genBtn">Generate Hardware Key 🔑</button>
    <button class="btn btn-copy" id="copyBtn">Copy to Clipboard</button>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    // Import ipcRenderer to communicate securely with main.js
    const { ipcRenderer } = require("electron");
    
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const machineIdField = document.getElementById("machineIdField");
    const keyField = document.getElementById("keyField");
    const genBtn = document.getElementById("genBtn");
    const copyBtn = document.getElementById("copyBtn");
    const msg = document.getElementById("msg");
    const scan = document.getElementById("scan");

    function randChar(){ return chars.charAt(Math.floor(Math.random() * chars.length)); }

    function format(raw){
      return `${raw.slice(0,4)}-${raw.slice(4,8)}-${raw.slice(8,12)}-${raw.slice(12,14)}`;
    }

    function setMsg(text, iconOk){
      msg.innerHTML = iconOk
        ? `<svg class="check" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 12L13 4.5" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="color: var(--mint);">${text}</span>`
        : `<span style="color: #fca5a5;">⚠ ${text}</span>`;
      msg.classList.remove("show");
      void msg.offsetWidth; // restart transition
      msg.classList.add("show");
    }

    async function generateKey(){
      const machineId = machineIdField.value.trim();
      
      // Validation Check
      if (!machineId) {
        setMsg("Enter Client's Machine ID!", false);
        machineIdField.style.borderColor = "#fca5a5";
        return;
      }
      machineIdField.style.borderColor = "";
      
      copyBtn.classList.remove("done");
      keyField.classList.add("active");

      // scanning sweep
      scan.classList.remove("run");
      void scan.offsetWidth;
      scan.classList.add("run");

      // Request hardware hash from Electron Backend (main.js)
      const response = await ipcRenderer.invoke("generate-key", machineId);
      
      if (!response.success) {
        setMsg(response.message, false);
        return;
      }

      // Format response for the slot machine animation
      const finalRaw = response.key.replace(/-/g, "");

      // slot-machine style character cycling before settling
      let ticks = 0;
      const totalTicks = 14;
      const interval = setInterval(() => {
        let display = "";
        for (let i = 0; i < 14; i++){
          display += i < ticks ? finalRaw[i] : randChar();
        }
        keyField.value = format(display);
        ticks++;
        if (ticks > totalTicks){
          clearInterval(interval);
          keyField.value = response.key; // Set exact final key
          setMsg("Hardware Key generated successfully!", true);
        }
      }, 45);
    }

    function copyKey(e){
      if (!keyField.value || keyField.value.includes("X")) return;
      navigator.clipboard.writeText(keyField.value.replace(/-/g, "-")); // Remove center dots if copied

      // ripple effect from click position
      const rect = copyBtn.getBoundingClientRect();
      const r = document.createElement("span");
      r.className = "ripple";
      const size = Math.max(rect.width, rect.height);
      r.style.width = r.style.height = size + "px";
      r.style.left = (e.clientX - rect.left - size/2) + "px";
      r.style.top = (e.clientY - rect.top - size/2) + "px";
      copyBtn.appendChild(r);
      setTimeout(() => r.remove(), 600);

      copyBtn.classList.add("done");
      setMsg("Copied to clipboard!", true);
    }

    genBtn.addEventListener("click", generateKey);
    copyBtn.addEventListener("click", copyKey);
  </script>
</body>
</html>
