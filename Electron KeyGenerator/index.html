<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quantum Key Generator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@300;400;600&display=swap');

  :root {
    --space-bg: #03040b;
    --glass-bg: rgba(9, 14, 23, 0.65);
    --primary: #00f0ff;
    --primary-glow: rgba(0, 240, 255, 0.4);
    --secondary: #7000ff;
    --accent: #ff0055;
    --text-main: #e2f1ff;
    --text-dim: #647b9e;
  }

  @property --border-angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background-color: var(--space-bg);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    perspective: 1200px;
  }

  /* --- Animated Perspective Grid --- */
  .cyber-grid {
    position: absolute;
    width: 200vw;
    height: 200vh;
    bottom: -40vh;
    left: -50vw;
    background-image: 
      linear-gradient(rgba(0, 240, 255, 0.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.1) 1px, transparent 1px);
    background-size: 50px 50px;
    transform: rotateX(75deg);
    animation: grid-scroll 3s linear infinite;
    mask-image: radial-gradient(ellipse at 50% 50%, black 10%, transparent 60%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 10%, transparent 60%);
    z-index: 0;
  }

  @keyframes grid-scroll {
    0% { transform: rotateX(75deg) translateY(0); }
    100% { transform: rotateX(75deg) translateY(50px); }
  }

  /* --- Ambient Nebula Glows --- */
  .nebula {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    z-index: 1;
    pointer-events: none;
    animation: pulse-nebula 10s ease-in-out infinite alternate;
  }
  .nebula-1 { width: 450px; height: 450px; background: rgba(0, 240, 255, 0.15); top: -10%; left: -5%; }
  .nebula-2 { width: 550px; height: 550px; background: rgba(112, 0, 255, 0.15); bottom: -20%; right: -5%; animation-delay: -5s; }

  @keyframes pulse-nebula {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.3); opacity: 0.8; }
  }

  /* --- 3D Parallax Container --- */
  .tilt-wrapper {
    position: relative;
    z-index: 10;
    transform-style: preserve-3d;
    transition: transform 0.1s ease-out;
  }

  /* --- Main Glass Card with Rotating Gradient Border --- */
  .card {
    width: 480px;
    position: relative;
    padding: 40px;
    background: var(--glass-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 20px;
    box-shadow: 
      0 30px 60px rgba(0, 0, 0, 0.8),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transform: translateZ(30px);
  }

  /* Rotating Border Effect */
  .card::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    background: conic-gradient(
      from var(--border-angle),
      var(--secondary),
      var(--primary),
      var(--secondary)
    );
    z-index: -1;
    animation: rotate-border 4s linear infinite;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }

  @keyframes rotate-border {
    to { --border-angle: 360deg; }
  }

  /* Decorative Crosshairs */
  .crosshair {
    position: absolute; width: 15px; height: 15px; border: 2px solid var(--primary); opacity: 0.5;
  }
  .tl { top: 15px; left: 15px; border-right: 0; border-bottom: 0; }
  .tr { top: 15px; right: 15px; border-left: 0; border-bottom: 0; }
  .bl { bottom: 15px; left: 15px; border-right: 0; border-top: 0; }
  .br { bottom: 15px; right: 15px; border-left: 0; border-top: 0; }

  /* Scanner Line */
  .scanner {
    position: absolute; top: 0; left: 0; right: 0; height: 100%;
    background: linear-gradient(to bottom, transparent, var(--primary-glow) 50%, transparent);
    transform: translateY(-100%);
    opacity: 0; pointer-events: none; mix-blend-mode: overlay;
  }
  .scanner.active { animation: scan 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes scan {
    0% { transform: translateY(-100%); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(100%); opacity: 0; }
  }

  /* --- Typography --- */
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--primary); background: rgba(0, 240, 255, 0.05);
    border: 1px solid rgba(0, 240, 255, 0.2); padding: 6px 12px;
    border-radius: 100px; text-transform: uppercase; letter-spacing: 2px;
    margin-bottom: 20px; box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
  }
  .badge .ping {
    width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
    box-shadow: 0 0 8px var(--primary); animation: ping 1.5s infinite;
  }
  @keyframes ping { 50% { opacity: 0.2; transform: scale(0.8); } }

  h1 {
    font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
    background: linear-gradient(to right, #fff, var(--primary));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.3));
  }
  
  p.desc { color: var(--text-dim); font-size: 14px; margin-bottom: 30px; letter-spacing: 0.5px; }

  /* --- Inputs --- */
  .field-group { text-align: left; margin-bottom: 24px; position: relative; }
  .label {
    display: block; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--primary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;
  }

  .input-base {
    width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff; font-family: 'JetBrains Mono', monospace; outline: none; transition: all 0.3s ease;
  }

  #machineId {
    padding: 16px; font-size: 15px; border-radius: 8px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
  }
  #machineId:focus {
    border-color: var(--primary); background: rgba(0, 240, 255, 0.03);
    box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1), inset 0 2px 10px rgba(0,0,0,0.5);
  }

  #keyOutput {
    padding: 20px 10px; font-size: 22px; font-weight: 800; text-align: center;
    letter-spacing: 4px; border-radius: 8px; color: var(--text-dim);
  }
  #keyOutput.decrypted {
    color: #fff; border-color: var(--primary);
    text-shadow: 0 0 10px var(--primary-glow);
    background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.05), transparent);
  }

  /* --- Buttons --- */
  .btn-sys {
    width: 100%; padding: 18px; font-family: 'Orbitron', sans-serif; font-size: 14px;
    font-weight: 700; letter-spacing: 3px; text-transform: uppercase; cursor: pointer;
    border: none; border-radius: 8px; position: relative; overflow: hidden;
    transition: all 0.2s ease; margin-bottom: 12px;
  }

  .btn-generate {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    box-shadow: 0 10px 20px rgba(112, 0, 255, 0.3);
  }
  .btn-generate::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-25deg); animation: shine 3s infinite;
  }
  @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }
  
  .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(0, 240, 255, 0.4); filter: brightness(1.1); }
  .btn-generate:active { transform: translateY(1px); }

  .btn-copy {
    background: rgba(255, 255, 255, 0.03); color: var(--text-main);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .btn-copy:hover { background: rgba(0, 240, 255, 0.08); border-color: var(--primary); color: var(--primary); }
  .btn-copy.copied { background: rgba(52, 211, 153, 0.1); border-color: #34d399; color: #34d399; }

  /* --- Status Message --- */
  .status-msg {
    min-height: 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    opacity: 0; transform: translateY(10px); transition: all 0.3s ease; margin-top: 10px;
  }
  .status-msg.show { opacity: 1; transform: translateY(0); }
  .status-err { color: var(--accent); }
  .status-ok { color: #34d399; }
</style>
</head>
<body>
  <div class="cyber-grid"></div>
  <div class="nebula nebula-1"></div>
  <div class="nebula nebula-2"></div>

  <div class="tilt-wrapper" id="tiltNode">
    <div class="card">
      <div class="crosshair tl"></div><div class="crosshair tr"></div>
      <div class="crosshair bl"></div><div class="crosshair br"></div>
      <div class="scanner" id="scanner"></div>

      <div style="text-align: center;">
        <div class="badge"><div class="ping"></div> System Uplink Secure</div>
        <h1>Key Forge</h1>
        <p class="desc">Quantum-encrypted hardware token generator.</p>
      </div>

      <div class="field-group">
        <label class="label">Target Hardware ID //></label>
        <input type="text" id="machineId" class="input-base" placeholder="MACHINE-XX-XX-XX-XX-XX-XX" autocomplete="off" spellcheck="false">
      </div>

      <div class="field-group">
        <input type="text" id="keyOutput" class="input-base" readonly placeholder="AWAITING INPUT...">
      </div>

      <button class="btn-sys btn-generate" id="genBtn">Initiate Decryption</button>
      <button class="btn-sys btn-copy" id="copyBtn">Copy Token</button>

      <div class="status-msg" id="statusMsg"></div>
    </div>
  </div>

  <script>
    // Electron IPC Bridge[cite: 9]
    const { ipcRenderer } = require("electron");

    const DOM = {
      tilt: document.getElementById('tiltNode'),
      machineId: document.getElementById('machineId'),
      keyOutput: document.getElementById('keyOutput'),
      genBtn: document.getElementById('genBtn'),
      copyBtn: document.getElementById('copyBtn'),
      statusMsg: document.getElementById('statusMsg'),
      scanner: document.getElementById('scanner')
    };

    const CHARSET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*";

    // 3D Mouse Parallax Effect
    document.addEventListener('mousemove', (e) => {
      const x = (window.innerWidth / 2 - e.pageX) / 25;
      const y = (window.innerHeight / 2 - e.pageY) / 25;
      DOM.tilt.style.transform = `rotateY(${-x}deg) rotateX(${y}deg) translateZ(30px)`;
    });

    function showStatus(message, type) {
      DOM.statusMsg.innerHTML = type === 'error' 
        ? `[!] ${message}` 
        : `[✓] ${message}`;
      DOM.statusMsg.className = `status-msg show ${type === 'error' ? 'status-err' : 'status-ok'}`;
    }

    function formatKey(raw) {
      return `${raw.slice(0,4)}-${raw.slice(4,8)}-${raw.slice(8,12)}-${raw.slice(12,14)}`;
    }

    async function processKeyGeneration() {
      const machineId = DOM.machineId.value.trim();
      
      if (!machineId) {
        showStatus("CRITICAL: TARGET ID MISSING", "error");
        DOM.machineId.style.borderColor = "var(--accent)";
        setTimeout(() => DOM.machineId.style.borderColor = "", 2000);
        return;
      }

      // Reset UI state
      DOM.copyBtn.className = "btn-sys btn-copy";
      DOM.copyBtn.innerText = "Copy Token";
      DOM.keyOutput.classList.remove("decrypted");
      
      // Trigger Scanner Animation
      DOM.scanner.classList.remove("active");
      void DOM.scanner.offsetWidth;
      DOM.scanner.classList.add("active");

      showStatus("ESTABLISHING HANDSHAKE...", "ok");

      // Secure IPC call to backend[cite: 9]
      const response = await ipcRenderer.invoke("generate-key", machineId);
      
      if (!response.success) {
        showStatus(response.message, "error");
        return;
      }

      // Matrix-style Decryption Animation
      const targetRaw = response.key.replace(/-/g, "");
      let iterations = 0;
      const maxIterations = 30;

      const decryptInterval = setInterval(() => {
        let displayStr = "";
        for (let i = 0; i < 14; i++) {
          // Reveal characters progressively
          if (i < Math.floor(iterations / 2.1)) {
            displayStr += targetRaw[i];
          } else {
            displayStr += CHARSET[Math.floor(Math.random() * CHARSET.length)];
          }
        }
        
        DOM.keyOutput.value = formatKey(displayStr);
        iterations++;

        if (iterations > maxIterations) {
          clearInterval(decryptInterval);
          DOM.keyOutput.value = response.key;
          DOM.keyOutput.classList.add("decrypted");
          showStatus("DECRYPTION COMPLETE", "ok");
        }
      }, 40);
    }

    function copyToClipboard() {
      const currentKey = DOM.keyOutput.value;
      if (!currentKey || currentKey.includes("AWAITING") || currentKey.includes("!")) return;
      
      navigator.clipboard.writeText(currentKey.replace(/-/g, "-"));
      DOM.copyBtn.className = "btn-sys btn-copy copied";
      DOM.copyBtn.innerText = "Token Copied";
      showStatus("TOKEN COPIED TO CLIPBOARD", "ok");
    }

    DOM.genBtn.addEventListener('click', processKeyGeneration);
    DOM.copyBtn.addEventListener('click', copyToClipboard);
  </script>
</body>
</html>
